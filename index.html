<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Aula 02 - WebAR com MindAR</title>

    <!-- Biblioteca A-Frame: criação da cena 3D -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- Biblioteca MindAR: reconhecimento e rastreamento da imagem -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <a-scene
        mindar-image="imageTargetSrc: ./assets/target/targets.mind
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Câmera do dispositivo -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <!-- Objeto associado à imagem que será reconhecida -->
        <a-entity mindar-image-target="targetIndex: 0">

            <!-- Cubo virtual -->
            <a-box
                position="0 0 0.25"
                rotation="0 0 0"
                scale="0.5 0.5 0.5">
            </a-box>

        </a-entity>

    </a-scene>

</body>
</html>
